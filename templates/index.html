<!DOCTYPE html>
<html>
<head>
    <title>Water Quality Prediction</title>
</head>

<body>

    <h1>Water Quality Prediction</h1>

    <form action="/predict" method="POST">

        <label>Turbidity (cm)</label>
        <input type="number" step="any" name="turbidity" required>
        <br><br>

        <label>DO (mg/L)</label>
        <input type="number" step="any" name="do" required>
        <br><br>

        <label>pH</label>
        <input type="number" step="any" name="ph" required>
        <br><br>

        <label>Temperature</label>
        <input type="number" step="any" name="temp" required>
        <br><br>

        <label>BOD (mg/L)</label>
        <input type="number" step="any" name="bod" required>
        <br><br>

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}
        <h2>Predicted Water Quality: {{ prediction }}</h2>
    {% endif %}

</body>
</html>
